name: XingGuang

options:
  bundleIdPrefix: com.xingguang.video
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

packages:
  XingGuangKit:
    path: .
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.0.0
  swift-mdk:
    url: https://github.com/wang-bin/swift-mdk.git
    revision: d52412460acf238c4780a1a3da16190fa05e27b4

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 15.0

targets:
  XingGuang:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: XingGuangKit
        product: XingGuangKit
      - package: XingGuangKit
        product: XingGuangJavaScript
      - package: MPVKit
        product: MPVKit
      - package: swift-mdk
        product: swift-mdk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingguang.video.ios
        PRODUCT_NAME: XingGuang
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        MDK_LICENSE_KEY: ""

  XingGuangKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/XingGuangKitTests
    dependencies:
      - package: XingGuangKit
        product: XingGuangKit
      - package: XingGuangKit
        product: XingGuangJavaScript
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingguang.video.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  XingGuangUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/XingGuangUITests
    dependencies:
      - target: XingGuang
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xingguang.video.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: XingGuang

schemes:
  XingGuang:
    build:
      targets:
        XingGuang: all
        XingGuangKitTests: [test]
        XingGuangUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: XingGuangKitTests
        - name: XingGuangUITests
    run:
      config: Debug
    archive:
      config: Release
